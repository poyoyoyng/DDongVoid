<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8fd2ff">
  <meta name="description" content="포요용의 미니게임천국에서 싱글 게임과 친구 대전을 즐기고 게임별 랭킹을 확인하세요.">
  <title>포요용의 미니게임천국</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="#home"><span class="brand-mark" aria-hidden="true">✦</span> 포요용의 미니게임천국</a>
      <nav aria-label="주 메뉴">
        <a href="#home" id="nav-games">게임</a>
        <a href="#guide/yacht" id="nav-guide">게임설명</a>
        <a href="#lobby" id="nav-lobby">대기방</a>
        <a href="#rankings/dodge" id="nav-rankings">랭킹</a>
      </nav>
      <div class="topbar-actions">
        <button class="button button-small button-outline" id="account-button" type="button">로그인</button>
      </div>
    </div>
  </header>
  <section class="shell music-player" id="music-player" aria-label="배경음악">
    <div class="music-bar">
      <div class="music-now">
        <span class="music-note" aria-hidden="true">♫</span>
        <div class="music-track-info">
          <span class="music-eyebrow">현재 곡 <span id="music-position">1 / 6</span></span>
          <p class="music-title" id="music-title">Underneath The Tree</p>
          <p class="music-artist" id="music-artist">Kelly Clarkson</p>
        </div>
      </div>
      <div class="music-controls" role="group" aria-label="음악 재생">
        <button class="button button-small button-primary" id="music-play" type="button" disabled><span aria-hidden="true">▶</span> 시작</button>
        <button class="button button-small button-outline" id="music-pause" type="button" disabled><span aria-hidden="true">Ⅱ</span> 일시정지</button>
        <button class="button button-small button-outline" id="music-next" type="button" disabled>다음 곡 <span aria-hidden="true">⏭</span></button>
      </div>
      <label class="music-volume" for="music-volume"><span>소리</span>
        <input id="music-volume" type="range" min="0" max="100" step="1" value="35" aria-label="음악 소리 조절">
        <output id="music-volume-value" for="music-volume">35%</output>
      </label>
    </div>
    <div class="music-timeline">
      <span class="music-time" id="music-elapsed" aria-label="현재 재생 시간">0:00</span>
      <input id="music-seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="음악 재생 위치" disabled>
      <span class="music-time" id="music-duration" aria-label="전체 재생 시간">--:--</span>
    </div>
    <div class="music-bottom">
      <p class="music-status" id="music-status" role="status">로그인하면 음악을 재생할 수 있어요.</p>
      <details class="music-playlist" id="music-playlist">
        <summary>재생 목록 <span id="music-count">6곡</span></summary>
        <ol id="music-tracks" aria-label="곡 선택"></ol>
      </details>
    </div>
  </section>
  <main class="shell main" id="app" aria-busy="true">
    <p class="loading" role="status">게임을 불러오는 중…</p>
  </main>
  <footer class="shell footer"><a class="brand" href="#home">포요용의 미니게임천국</a></footer>
  <dialog id="account-dialog" aria-labelledby="account-title"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript>이 게임을 실행하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
</body>
</html>
