name: Jeung Yut web checks
on:
  push:
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  rules-and-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check engine.mjs && node --check app.mjs && node --check server.mjs
      - run: npm test
